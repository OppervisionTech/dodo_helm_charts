name: Helm Publish (OCI)

on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart to package and publish"
        type: string
        default: aegis-agent

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Helm dependency build
        run: helm dependency build charts/${{ inputs.chart }}

      - name: Helm lint
        run: helm lint charts/${{ inputs.chart }}

      - name: Helm package
        run: helm package charts/${{ inputs.chart }}

      - name: Login to Docker Hub OCI registry
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Push chart to Docker Hub
        run: |
          pkg=$(ls ${{ inputs.chart }}-*.tgz)
          echo "Pushing $pkg to oci://registry-1.docker.io/enzotrevisan9"
          helm push "$pkg" oci://registry-1.docker.io/enzotrevisan9
