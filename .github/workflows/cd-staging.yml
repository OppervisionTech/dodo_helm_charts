name: CD - Staging

# Auto-redeploys whatever charts.yaml changed to staging, but ONLY for charts
# that already have a live release in the `dodo` namespace. A chart that
# exists in this repo but was never deployed (e.g. aegis-falco,
# aegis-security-orchestrator at the time this was written) is deliberately
# left alone — bringing up a brand-new component stays a manual decision,
# this pipeline only keeps already-running things in sync with main.
#
# A change to charts/_library/** (the shared local dependency almost every
# other chart depends on) does NOT trigger a redeploy of its consumers —
# known v1 gap, see charts/_library/README or the PR that introduced this
# workflow for context. Touch the consuming chart(s) manually if a
# library-only change needs to take effect.

on:
  push:
    branches: [main]
    paths: ["charts/**"]

permissions:
  contents: read

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      chart_list: ${{ steps.build-matrix.outputs.chart_list }}
      has_charts: ${{ steps.build-matrix.outputs.has_charts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed, deployable chart directories
        id: build-matrix
        run: |
          set -euo pipefail

          if ! git rev-parse HEAD^ > /dev/null 2>&1; then
            echo "No parent commit (first commit in repo history) — nothing to diff."
            echo "chart_list=[]" >> "$GITHUB_OUTPUT"
            echo "has_charts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD -- 'charts/*' \
            | awk -F/ '{print $2}' \
            | sort -u)

          CHARTS=""
          for name in $CHANGED_DIRS; do
            chart_yaml="charts/${name}/Chart.yaml"
            if [ ! -f "$chart_yaml" ]; then
              continue
            fi
            chart_type=$(grep '^type:' "$chart_yaml" | awk '{print $2}')
            if [ "$chart_type" = "library" ]; then
              echo "Skipping library chart: $name (never deployed on its own)"
              continue
            fi
            CHARTS="${CHARTS}${name}\n"
          done
          CHARTS=$(printf '%b' "$CHARTS" | grep -v '^$' || true)

          {
            echo "### Changed charts detected"
            echo '```'
            echo "${CHARTS:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$CHARTS" ]; then
            echo "chart_list=[]" >> "$GITHUB_OUTPUT"
            echo "has_charts=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "$CHARTS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "chart_list=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_charts=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chart: ${{ fromJson(needs.detect-changes.outputs.chart_list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Save DOKS kubeconfig
        run: |
          doctl kubernetes cluster kubeconfig save \
            "${{ vars.DOKS_CLUSTER_NAME || 'dodo-aegisops-k8s' }}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Check whether ${{ matrix.chart }} is an existing release
        id: check
        run: |
          if helm status "${{ matrix.chart }}" -n dodo > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip - no existing release
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "::warning title=Skipped ${{ matrix.chart }}::No existing Helm release named '${{ matrix.chart }}' in namespace 'dodo'. This chart was never deployed, so it will NOT be auto-deployed. Deploy it manually the first time if that's intended."
          {
            echo "### Skipped: ${{ matrix.chart }}"
            echo "No live release found (helm status ${{ matrix.chart }} -n dodo failed)."
            echo "Bringing up a brand-new component stays a deliberate manual step."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build chart dependencies
        if: steps.check.outputs.exists == 'true'
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Upgrade ${{ matrix.chart }}
        if: steps.check.outputs.exists == 'true'
        run: |
          helm upgrade --install "${{ matrix.chart }}" "charts/${{ matrix.chart }}" \
            --namespace dodo \
            --values "charts/${{ matrix.chart }}/values.yaml" \
            --values "charts/${{ matrix.chart }}/values-staging.yaml" \
            --atomic --cleanup-on-fail --timeout 10m --wait

      - name: Record result
        if: always() && steps.check.outputs.exists == 'true'
        run: |
          {
            echo "### Deployed: ${{ matrix.chart }}"
            helm status "${{ matrix.chart }}" -n dodo | head -n 10
          } >> "$GITHUB_STEP_SUMMARY" || true

  summary:
    needs: [detect-changes, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No changes case
        if: needs.detect-changes.outputs.has_charts == 'false'
        run: echo "### Nothing to deploy - no charts/* changed in this push." >> "$GITHUB_STEP_SUMMARY"

      - uses: digitalocean/action-doctl@v2
        if: needs.detect-changes.outputs.has_charts == 'true'
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Save DOKS kubeconfig
        if: needs.detect-changes.outputs.has_charts == 'true'
        run: |
          doctl kubernetes cluster kubeconfig save \
            "${{ vars.DOKS_CLUSTER_NAME || 'dodo-aegisops-k8s' }}"

      - uses: azure/setup-helm@v4
        if: needs.detect-changes.outputs.has_charts == 'true'
        with:
          version: v3.17.0

      - name: Current cluster state
        if: needs.detect-changes.outputs.has_charts == 'true'
        run: |
          {
            echo "### Live releases in 'dodo' after this run"
            echo '```'
            helm list -n dodo
            echo '```'
            echo ""
            echo "Matrix result: **${{ needs.deploy.result }}**"
          } >> "$GITHUB_STEP_SUMMARY"
