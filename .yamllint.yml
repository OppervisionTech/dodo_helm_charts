---
extends: default

# Helm template files contain Go templating ({{- ... -}}) which yamllint can't parse.
# Lock files are auto-generated by `helm dependency build`.
ignore: |
  charts/*/templates/
  charts/*/charts/
  charts/*/Chart.lock

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  empty-lines:
    max: 2
