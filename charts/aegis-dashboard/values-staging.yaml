# =============================================================================
# aegis-dashboard — Staging Environment Values
# =============================================================================
# 2 réplicas, HPA moderado, TLS via cert-manager (LE production), ingress Kong.
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_dashboard
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  className: kong
  hostname: dashboard.staging.oppervision.com.br
  tls:
    enabled: true
    secretName: dashboard-qa-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"

dashboard:
  queryApiUrl: "http://aegis-query-api:8080"

# Env runtime (SSR / middleware / API routes), injetadas via ConfigMap → envFrom.
#
# Vars com prefixo NEXT_PUBLIC_* são inlineadas pelo webpack do Next.js NO BUILD
# (DefinePlugin). Setar aqui sozinho NÃO atualiza o bundle JS já compilado —
# pro browser e pro middleware compilado é o build-arg que vale. Use vars sem
# prefixo (ex.: PORTAL_URL) quando precisar de override em runtime: o
# middleware do dashboard prefere PORTAL_URL sobre NEXT_PUBLIC_PORTAL_URL pra
# justamente permitir override sem rebuild.
env:
  QUERY_API_URL: "http://aegis-query-api:8080"
  PORTAL_URL: https://portal.staging.oppervision.com.br
  NEXT_PUBLIC_PORTAL_URL: https://portal.staging.oppervision.com.br
  NEXT_PUBLIC_DASHBOARD_URL: https://dashboard.staging.oppervision.com.br
  NEXT_PUBLIC_API_URL: https://api.staging.oppervision.com.br
  NEXT_PUBLIC_WS_URL: wss://api.staging.oppervision.com.br
  PORTAL_INTERNAL_URL: http://aegis-portal.dodo.svc.cluster.local:3000
  COOKIE_DOMAIN: ".staging.oppervision.com.br"
  AI_CORE_URL: http://aegis-ai-core:8000

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - ports:
        - protocol: TCP
          port: 8080  # query-api
    - ports:
        - protocol: TCP
          port: 8000  # ai-core
    - ports:
        - protocol: TCP
          port: 3000  # portal service port
        - protocol: TCP
          port: 3001  # portal container port
    - ports:
        - protocol: TCP
          port: 443   # Supabase + external HTTPS
