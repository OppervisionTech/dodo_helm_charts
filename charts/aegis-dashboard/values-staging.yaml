# =============================================================================
# aegis-dashboard — Staging Environment Values
# =============================================================================
# 2 réplicas, HPA moderado, TLS via cert-manager (LE staging), ingress Kong.
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_dashboard
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 2

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  className: kong
  hostname: dashboard.staging.aegisops.io
  tls:
    enabled: true
    secretName: dashboard-qa-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"

dashboard:
  queryApiUrl: "http://aegis-query-api:8080"
