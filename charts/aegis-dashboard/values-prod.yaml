# =============================================================================
# aegis-dashboard — Production Environment Values
# =============================================================================
# HPA (3-10), TLS via cert-manager (LE production), ingress Kong.
# Headers de segurança obrigatórios (HSTS, X-Frame-Options, CSP).
# =============================================================================

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  className: kong
  hostname: dashboard.aegisops.io
  tls:
    enabled: true
    secretName: dashboard-prod-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    konghq.com/plugins: "dashboard-rate-limit,security-headers"

dashboard:
  queryApiUrl: "http://aegis-query-api:8080"
