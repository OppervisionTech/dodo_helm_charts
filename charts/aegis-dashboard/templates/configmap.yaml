apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "queryApiUrl": {{ .Values.dashboard.queryApiUrl | quote }}
    }
  QUERY_API_URL: {{ .Values.dashboard.queryApiUrl | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
