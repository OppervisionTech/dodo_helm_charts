nameOverride: ""
fullnameOverride: ""
component: portal
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-portal
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  type: http
  liveness:
    path: /
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /api/health
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: false
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 3000

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: kong
  hostname: portal.oppervision.com.br
  tls:
    enabled: true
    secretName: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    konghq.com/plugins: "security-headers"

portal:
  port: 3001
  # Supabase public values — publishable key é exposta por design no client.
  # Ficam aqui (não em secrets) porque NÃO são segredos e precisam estar no ConfigMap.
  supabase:
    projectUrl: ""
    publishableKey: ""

# Variáveis de ambiente injetadas via ConfigMap (não-sensíveis).
# Atenção Next.js: NEXT_PUBLIC_* aqui só atendem o SSR / API routes do Node.
# O bundle JS do client foi inlinado em build time pelo Dockerfile do dodo_portal —
# o repo `dodo_portal` precisa publicar imagem com os build-args corretos para staging
# (ARG NEXT_PUBLIC_*). Override aqui sozinho NÃO atualiza o bundle do browser.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  ALLOWED_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000
  PORTAL_QUERY_API_URL: http://aegis-query-api:8080
  # Fase 3 cutover: dodo_portal no longer touches Prisma/Stripe/Redis
  # directly — every route under app/api/** is a thin proxy to this
  # service now (see dodo_portal/src/lib/portal-bff.ts).
  PORTAL_BFF_INTERNAL_URL: http://aegis-portal-bff:8081

# Secret externo referenciado por nome (não criado pelo chart).
#   appCredentials — só NEXT_PUBLIC_SUPABASE_* (anon key, para o próprio
#                    login/sessão do usuário) permanece necessário aqui.
#                    SUPABASE_SERVICE_ROLE_KEY, STRIPE_*, DATABASE_URL
#                    migraram para o Secret do aegis-portal-bff — não são
#                    mais lidos por este serviço.
secrets:
  appCredentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 3001
  egress:
    - ports:
        - protocol: TCP
          port: 8080  # query-api (in-cluster) — não migrado ainda, chamadas diretas remanescentes
    - ports:
        - protocol: TCP
          port: 8081  # aegis-portal-bff (in-cluster) — todo o restante das rotas
    - ports:
        - protocol: TCP
          port: 443   # Supabase Auth (login/sessão do usuário via supabase-ssr)

tolerations: []
nodeSelector: {}
extraAnnotations: {}
