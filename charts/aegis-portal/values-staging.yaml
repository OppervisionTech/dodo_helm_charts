# =============================================================================
# aegis-portal — Staging Environment Values
# =============================================================================
# Portal Next.js: NEXT_PUBLIC_* aqui valem para SSR/API routes. O bundle JS
# do client foi inlinado em build time pelo Dockerfile do dodo_portal —
# certifique-se que a imagem em ghcr.io/oppervisiontech foi buildada com
# build-args ARG NEXT_PUBLIC_API_URL=https://api.staging.oppervision.com.br etc.
#
# Pré-requisitos no cluster antes do helm install:
#   1. Secret "dodo-db-credentials" no namespace alvo (Redis host/port/password)
#   2. Secret "aegis-portal-app-secrets" com SUPABASE_SERVICE_ROLE_KEY, STRIPE_*,
#      DATABASE_URL (pipeline do repo dodo_portal cria/atualiza)
# =============================================================================

image:
  repository: ghcr.io/oppervisiontech/dodo_portal
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  className: kong
  hostname: portal.staging.oppervision.com.br
  tls:
    enabled: true
    secretName: portal-staging-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"

env:
  NEXT_PUBLIC_APP_URL: https://portal.staging.oppervision.com.br
  NEXT_PUBLIC_DASHBOARD_URL: https://dashboard.staging.oppervision.com.br
  COOKIE_DOMAIN: ".staging.oppervision.com.br"
  ALLOWED_ORIGINS: https://dashboard.staging.oppervision.com.br
  NEXT_PUBLIC_API_URL: https://api.staging.oppervision.com.br
  PORTAL_QUERY_API_URL: http://aegis-query-api:8080
  PORTAL_BFF_INTERNAL_URL: "http://aegis-portal-bff:8081"

# Os valores reais Supabase project URL e publishable key vêm do pipeline do
# repo dodo_portal (`--set portal.supabase.projectUrl=...`). Defaults vazios
# em values.yaml. Configurando aqui ficam visíveis no Git — só os valores
# explicitamente públicos (publishable, project URL) podem ficar.
portal:
  supabase:
    projectUrl: "https://vnkhsfwxqkyvjyncmvrt.supabase.co"
    publishableKey: "sb_publishable_5tCYIS89vr7JgrpkAK6EvQ_tj3FGUcf"

secrets:
  appCredentials: aegis-portal-app-secrets

health:
  liveness:
    initialDelay: 300
  readiness:
    path: /
    initialDelay: 10

# Copiado de values.yaml (listas do Helm não fazem merge) + egress para o BFF.
networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 3001
  egress:
    - ports:
        - protocol: TCP
          port: 8080  # query-api (in-cluster)
    - ports:
        - protocol: TCP
          port: 6379  # Redis (VM de bancos)
    - ports:
        - protocol: TCP
          port: 443   # Supabase REST + Stripe (external HTTPS)
    - ports:
        - protocol: TCP
          port: 6543  # Supabase pooler
    - ports:
        - protocol: TCP
          port: 5432  # Supabase direct
    - ports:
        - protocol: TCP
          port: 8081  # aegis-portal-bff
