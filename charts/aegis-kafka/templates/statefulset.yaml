apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    {{- include "aegis.annotations" . | nindent 4 }}
spec:
  serviceName: {{ include "aegis.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        {{- include "aegis.prometheusAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- include "aegis.podSecurityContext" . | nindent 6 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka
          {{- include "aegis.image" . | nindent 10 }}
          ports:
            - name: kafka
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: inter-broker
              containerPort: {{ .Values.service.interBrokerPort }}
              protocol: TCP
          {{- include "aegis.healthCheck" . | nindent 10 }}
          {{- include "aegis.resourceLimits" . | nindent 10 }}
          env:
            - name: KAFKA_CFG_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: {{ .Values.kafka.clusterId | default "aegisops-kafka-cluster" | quote }}
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:{{ .Values.service.port }},CONTROLLER://:{{ .Values.service.interBrokerPort }}"
            - name: KAFKA_CFG_LOG_RETENTION_HOURS
              value: {{ .Values.kafka.config.logRetentionHours | quote }}
            - name: KAFKA_CFG_NUM_PARTITIONS
              value: {{ .Values.kafka.config.numPartitionsDefault | quote }}
            - name: KAFKA_CFG_DEFAULT_REPLICATION_FACTOR
              value: {{ .Values.kafka.config.defaultReplicationFactor | quote }}
            - name: KAFKA_CFG_MIN_INSYNC_REPLICAS
              value: {{ .Values.kafka.config.minInsyncReplicas | quote }}
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: {{ .Values.kafka.config.autoCreateTopicsEnable | quote }}
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "aegis.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
