apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  kafka-config.yaml: |
    log.retention.hours: {{ .Values.kafka.config.logRetentionHours }}
    num.partitions: {{ .Values.kafka.config.numPartitionsDefault }}
    default.replication.factor: {{ .Values.kafka.config.defaultReplicationFactor }}
    min.insync.replicas: {{ .Values.kafka.config.minInsyncReplicas }}
    auto.create.topics.enable: {{ .Values.kafka.config.autoCreateTopicsEnable }}
    log.segment.bytes: {{ .Values.kafka.config.logSegmentBytes }}
    log.retention.check.interval.ms: {{ .Values.kafka.config.logRetentionCheckIntervalMs }}
