nameOverride: ""
fullnameOverride: ""
component: otel-worker
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-otel-worker
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

worker:
  port: 8080
  kafkaTopic: otel-traces
  consumerGroup: aegis-otel-worker
  kafkaBrokers: "aegis-kafka:9092"
  clickhouseConnection: "tcp://aegis-clickhouse:9000/aegisops"
  topologyExtractionEnabled: true

secrets:
  credentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 9000  # ClickHouse native
    - ports:
        - protocol: TCP
          port: 8123  # ClickHouse HTTP

tolerations: []
nodeSelector: {}
extraAnnotations: {}
