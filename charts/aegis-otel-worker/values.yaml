nameOverride: ""
fullnameOverride: ""
component: otel-worker
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-otel-worker
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

worker:
  name: otel-worker
  port: 8080

# Variáveis de ambiente injetadas via ConfigMap (não-sensíveis).
# DB endpoints (host/port/password) vêm do Secret "dodo-db-credentials" do cluster
# via valueFrom.secretKeyRef no deployment.yaml.
env:
  KAFKA_TOPICS: otel-traces
  KAFKA_GROUP_ID: otel-worker-group
  CLICKHOUSE_DB: dodo_logs
  LOG_LEVEL: info
  METRICS_PORT: "9090"
  HEALTH_PORT: "8080"
  CH_BATCH_SIZE: "5000"
  CH_FLUSH_INTERVAL: 5s

# Secrets externos referenciados por nome (não criados pelo chart).
#   appCredentials — segredos específicos da app (vazio para otel-worker).
#   credentials    — pattern legacy mantido para forward-compat.
# O Secret "dodo-db-credentials" do cluster é referenciado diretamente pelo
# deployment via valueFrom.secretKeyRef (ver helper aegis.dbCredsEnv).
secrets:
  appCredentials: ""
  credentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 9000  # ClickHouse native
    - ports:
        - protocol: TCP
          port: 8123  # ClickHouse HTTP
    - ports:
        - protocol: TCP
          port: 5433  # pgvector (topology)

tolerations: []
nodeSelector: {}
extraAnnotations: {}
