# =============================================================================
# aegis-otel-worker — Staging Environment Values
# =============================================================================
# Pré-requisito: Secret "dodo-db-credentials" presente no namespace alvo
# (provisionado fora deste chart, contém host/port/password de cada banco).
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_otel_worker
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

aegis:
  agentID: ""  # registrar no portal para habilitar self-monitoring
  environment: "staging"
