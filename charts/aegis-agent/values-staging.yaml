# =============================================================================
# aegis-agent — Staging Environment Values
# =============================================================================
# Simula produção em escala reduzida.
# Recursos moderados, coleta padrão.
# =============================================================================

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

agent:
  collectionInterval: 30s
  ingestorEndpoint: "aegis-ingestor:50051"
  # Privileged required: host /proc, /sys access + write agent_id/buffer to hostPath
  privileged: true
  disableHealthChecks: true

buffer:
  type: hostPath
  hostPath: /var/lib/aegis-agent/buffer

# Dedicated hostname — same reason as aegis-kong's routes.ingestor: gRPC and
# HTTPS can't unambiguously share a hostname (ALPN negotiation), so staging's
# enrollment route lives on api.staging.* rather than grpc.staging.*.
enrollment:
  endpoint: "https://api.staging.oppervision.com.br/v1/enroll"
