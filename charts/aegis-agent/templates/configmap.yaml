apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  agent.yaml: |
    {{- $staticTls := ne .Values.tls.secretName "" }}
    {{- $selfEnroll := and (not $staticTls) (ne .Values.apiKey.secretName "") }}
    endpoint:
      address: {{ .Values.agent.ingestorEndpoint | quote }}
      timeout_ms: 5000
      retry_max: 3
      retry_backoff_ms: 1000

    # Three-way TLS config:
    #   tls.secretName set      -> static/pre-provisioned cert, mounted at /etc/aegis/tls
    #   tls.secretName empty
    #     and apiKey.secretName -> self-enrollment, cert written to /var/lib/aegis-agent/certs
    #   neither set              -> TLS disabled
    tls:
      enabled: {{ or $staticTls $selfEnroll }}
      ca_cert_path: {{ if $staticTls }}"/etc/aegis/tls/ca.crt"{{ else if $selfEnroll }}"/var/lib/aegis-agent/certs/ca.pem"{{ else }}""{{ end }}
      client_cert_path: {{ if $staticTls }}"/etc/aegis/tls/tls.crt"{{ else if $selfEnroll }}"/var/lib/aegis-agent/certs/agent.pem"{{ else }}""{{ end }}
      client_key_path: {{ if $staticTls }}"/etc/aegis/tls/tls.key"{{ else if $selfEnroll }}"/var/lib/aegis-agent/certs/agent-key.pem"{{ else }}""{{ end }}
      verify_server: {{ or $staticTls $selfEnroll }}

    # HTTPS endpoint for mTLS certificate auto-enrollment on first start.
    # Empty disables it (static tls.secretName above, or TLS disabled).
    enrollment_endpoint: {{ if $selfEnroll }}{{ .Values.enrollment.endpoint | quote }}{{ else }}""{{ end }}

    buffer:
      path: {{ .Values.agent.bufferPath | quote }}
      max_size_bytes: 536870912
      flush_interval_ms: 5000
      max_batch_size: 500

    logging:
      level: {{ .Values.agent.logging.level | default "info" | quote }}
      output: "stdout"

    config_pull_interval_seconds: 0
    agent_id_path: "/var/lib/aegis-agent/agent-id"

    labels:
      environment: {{ .Values.agent.labels.environment | default "dev" | quote }}

    redaction_patterns: []

    collectors:
      - name: cpu
        enabled: {{ .Values.agent.collectors.cpu }}
        interval_seconds: 5
      - name: memory
        enabled: {{ .Values.agent.collectors.memory }}
        interval_seconds: 5
      - name: disk
        enabled: {{ .Values.agent.collectors.disk }}
        interval_seconds: 10
      - name: network
        enabled: {{ .Values.agent.collectors.network }}
        interval_seconds: 5
      - name: process
        enabled: {{ .Values.agent.collectors.processes }}
        interval_seconds: 10
      - name: kubernetes
        enabled: {{ .Values.agent.collectors.kubernetes }}
        interval_seconds: 15
      - name: logs
        enabled: {{ .Values.agent.collectors.logs.enabled }}
        interval_seconds: 1
        {{- if .Values.agent.collectors.logs.enabled }}
        parameters:
          paths: {{ .Values.agent.collectors.logs.paths | quote }}
          max_lines_per_sec: {{ .Values.agent.collectors.logs.maxLinesPerSec | quote }}
        {{- end }}
      - name: heartbeat
        enabled: true
        interval_seconds: 30
      - name: self_metrics
        enabled: true
        interval_seconds: 30
      - name: inventory
        enabled: true
        interval_seconds: 3600
      - name: security
        enabled: false
        interval_seconds: 15
      - name: docker
        enabled: false
        interval_seconds: 10
