{{- if and .Values.serviceAccount.create .Values.agent.collectors.kubernetes }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/stats", "pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aegis.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aegis.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.workflows.allowScripts }}
{{- if not .Values.serviceAccount.create }}
{{- fail "workflows.allowScripts needs serviceAccount.create=true (never grant Job creation to a shared ServiceAccount)" }}
{{- end }}
{{- range $ns := .Values.workflows.namespaces }}
{{- if or (eq $ns $.Release.Namespace) (hasPrefix "kube-" $ns) (eq $ns "default") }}
{{- fail (printf "workflows.namespaces: %q is not allowed for script Jobs — use a dedicated namespace" $ns) }}
{{- end }}
{{- if $.Values.workflows.createNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
{{- end }}
---
# DoDo workflow scripts only: create the script's (immutable) ConfigMap and
# its Job here. No patch/delete, nothing outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aegis.fullname" $ }}-workflow-scripts
  namespace: {{ $ns }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aegis.fullname" $ }}-workflow-scripts
  namespace: {{ $ns }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aegis.fullname" $ }}-workflow-scripts
subjects:
  - kind: ServiceAccount
    name: {{ include "aegis.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
