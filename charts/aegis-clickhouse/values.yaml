nameOverride: ""
fullnameOverride: ""
component: clickhouse
gitSha: ""

image:
  repository: clickhouse/clickhouse-server
  tag: "24.2"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

health:
  type: http
  liveness:
    path: /ping
    port: http
    initialDelay: 30
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /ping
    port: http
    initialDelay: 10
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

containerSecurityContext:
  readOnlyRootFilesystem: false

metrics:
  enabled: true
  port: 9363
  path: /metrics

service:
  httpPort: 8123
  nativePort: 9000

persistence:
  enabled: true
  storageClass: ""
  size: 100Gi

pdb:
  enabled: true
  minAvailable: 1

clickhouse:
  database: aegisops
  config:
    maxMemoryUsage: 2147483648  # 2GB
    maxThreads: 4
    mergeTreeMaxRowsToUseCache: 1048576
  logRetentionDays: 30

secrets:
  credentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8123  # HTTP
    - ports:
        - protocol: TCP
          port: 9000  # Native
  egress: []

tolerations: []
nodeSelector: {}
extraAnnotations: {}
