apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.nativePort }}
      targetPort: native
      protocol: TCP
      name: native
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-headless
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.service.nativePort }}
      targetPort: native
      name: native
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
