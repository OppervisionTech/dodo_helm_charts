apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegis.fullname" . }}-migrate
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          {{- include "aegis.image" . | nindent 10 }}
          args: ["--migrate"]
          env:
            {{- include "aegis.dbCredsEnv" (dict "components" (list "clickhouse" "kafka")) | nindent 12 }}
            - name: CLICKHOUSE_ADDR
              value: "$(CLICKHOUSE_HOST):$(CLICKHOUSE_NATIVE_PORT)"
            - name: CLICKHOUSE_USER
              value: "$(CLICKHOUSE_USERNAME)"
            - name: CLICKHOUSE_DATABASE
              value: "$(CLICKHOUSE_DB)"
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BOOTSTRAP)"
          {{- if .Values.secrets.credentials }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.credentials }}
          {{- end }}
