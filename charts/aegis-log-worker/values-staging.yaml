# =============================================================================
# aegis-log-worker — Staging Environment Values
# =============================================================================

image:
  repository: ghcr.io/oppervisiontech/dodo_log_worker
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

aegis:
  agentID: "11111111-0000-4000-a000-000000000004"
  environment: "staging"
