# =============================================================================
# aegis-log-worker — Staging Environment Values
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_log_worker
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

aegis:
  agentID: "11111111-0000-4000-a000-000000000004"
  environment: "staging"
