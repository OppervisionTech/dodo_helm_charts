nameOverride: ""
fullnameOverride: ""
component: log-worker
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-log-worker
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

worker:
  port: 8080
  kafkaTopic: raw-logs
  consumerGroup: aegis-log-worker
  kafkaBrokers: "aegis-kafka:9092"
  clickhouseConnection: "tcp://aegis-clickhouse:9000/aegisops"
  drainDepth: 4
  drainSimThreshold: 0.4

secrets:
  credentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 9000  # ClickHouse native
    - ports:
        - protocol: TCP
          port: 8123  # ClickHouse HTTP

tolerations: []
nodeSelector: {}
extraAnnotations: {}

aegis:
  agentID: "11111111-0000-4000-a000-000000000004"
  ingestorAddr: "aegis-ingestor:50051"
  environment: "production"

# Política de retenção do ambiente (ConfigMap criado pelo Terraform em
# dodo_infra/terraform). Desligado: o chart usa os próprios valores.
retentionPolicy:
  enabled: false
  configMap: dodo-retention-policy
