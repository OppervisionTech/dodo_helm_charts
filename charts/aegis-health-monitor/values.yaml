nameOverride: ""
fullnameOverride: ""
component: health-monitor
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-health-monitor
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

worker:
  port: 8080
  kafkaTopic: agent-heartbeats
  consumerGroup: aegis-health-monitor
  kafkaBrokers: "aegis-kafka:9092"
  redisConnection: "aegis-redis:6379"
  heartbeatTTL: 90s
  escalationP1Threshold: 5m
  escalationP2Threshold: 2m

secrets:
  credentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 6379  # Redis

tolerations: []
nodeSelector: {}
extraAnnotations: {}

aegis:
  agentID: "11111111-0000-4000-a000-000000000006"
  ingestorAddr: "aegis-ingestor:50051"
  environment: "production"
