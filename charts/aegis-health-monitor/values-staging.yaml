# =============================================================================
# aegis-health-monitor — Staging Environment Values
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_health_monitor
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

worker:
  heartbeatTTL: 90s
  escalationP1Threshold: 5m
  escalationP2Threshold: 2m

aegis:
  agentID: "11111111-0000-4000-a000-000000000006"
  environment: "staging"
