# =============================================================================
# aegis-health-monitor — Staging Environment Values
# =============================================================================

image:
  repository: ghcr.io/oppervisiontech/dodo_health_monitor
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

worker:
  heartbeatTTL: 90s
  escalationP1Threshold: 5m
  escalationP2Threshold: 2m

aegis:
  agentID: ""  # registrar no portal para habilitar self-monitoring
  environment: "staging"
