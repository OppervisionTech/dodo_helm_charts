apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    {{- include "aegis.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        {{- include "aegis.prometheusAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aegis.podSecurityContext" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          {{- include "aegis.image" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- include "aegis.healthCheck" . | nindent 10 }}
          {{- include "aegis.resourceLimits" . | nindent 10 }}
          {{- include "aegis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "aegis.dbCredsEnv" (dict "components" (list "redis" "kafka" "pg" "tsdb" "clickhouse")) | nindent 12 }}
            - name: REDIS_ADDR
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BOOTSTRAP)"
            - name: PLATFORM_TELEMETRY_CMDB_DSN
              value: "postgres://dodo_app:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/dodo_cmdb?sslmode=disable"
            - name: PLATFORM_TELEMETRY_TIMESCALEDB_DSN
              value: "postgres://dodo:$(TSDB_PASSWORD)@$(TSDB_HOST):$(TSDB_PORT)/dodo_metrics?sslmode=disable"
            - name: PLATFORM_TELEMETRY_CLICKHOUSE_ADDR
              value: "$(CLICKHOUSE_HOST):$(CLICKHOUSE_NATIVE_PORT)"
            - name: PLATFORM_TELEMETRY_CLICKHOUSE_USER
              value: "$(CLICKHOUSE_USERNAME)"
            - name: PLATFORM_TELEMETRY_CLICKHOUSE_PASSWORD
              value: "$(CLICKHOUSE_PASSWORD)"
            - name: PLATFORM_TELEMETRY_CLICKHOUSE_DB
              value: "$(CLICKHOUSE_DB)"
            {{- if .Values.aegis.agentID }}
            - name: AEGIS_AGENT_ID
              value: {{ .Values.aegis.agentID | quote }}
            - name: AEGIS_INGESTOR_ADDR
              value: {{ .Values.aegis.ingestorAddr | quote }}
            - name: AEGIS_ENVIRONMENT
              value: {{ .Values.aegis.environment | quote }}
            {{- end }}
          {{- if .Values.secrets.credentials }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.credentials }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/aegis-worker
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "aegis.fullname" . }}
        - name: tmp
          emptyDir: {}
