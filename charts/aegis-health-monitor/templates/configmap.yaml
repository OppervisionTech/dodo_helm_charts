apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  config.yaml: |
    kafka_topic: {{ .Values.worker.kafkaTopic | quote }}
    consumer_group: {{ .Values.worker.consumerGroup | quote }}
    kafka_brokers: {{ .Values.worker.kafkaBrokers | quote }}
    redis_connection: {{ .Values.worker.redisConnection | quote }}
    heartbeat_ttl: {{ .Values.worker.heartbeatTTL | quote }}
    escalation_p1_threshold: {{ .Values.worker.escalationP1Threshold | quote }}
    escalation_p2_threshold: {{ .Values.worker.escalationP2Threshold | quote }}
