# =============================================================================
# aegis-cmdb-worker — Staging Environment Values
# =============================================================================
# Pré-requisito: Secret "dodo-db-credentials" presente no namespace alvo.
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_cmdb_worker
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

aegis:
  agentID: ""  # registrar no portal para habilitar self-monitoring
  environment: "staging"
