# =============================================================================
# aegis-security-orchestrator — Staging Environment Values
# =============================================================================
# Pré-requisito: Secret "dodo-db-credentials" presente no namespace alvo.
# =============================================================================

image:
  repository: ghcr.io/oppervisiontech/dodo_security_orchestrator
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi
