# =============================================================================
# aegis-cert-worker — Staging Environment Values
# =============================================================================

image:
  repository: ghcr.io/oppervisiontech/dodo_cert_worker
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 96Mi

worker:
  pollInterval: 5m
