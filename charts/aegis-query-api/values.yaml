nameOverride: ""
fullnameOverride: ""
component: query-api
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-query-api
  tag: "latest"
  pullPolicy: Always

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

# Externamente exposto via Kong + cert-manager. Default disabled — habilitar
# por ambiente. Kong já trata WebSocket upgrade transparente, então o mesmo
# host serve REST e WS.
ingress:
  enabled: false
  className: kong
  hostname: api.oppervision.com.br
  tls:
    enabled: true
    secretName: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    konghq.com/plugins: "security-headers"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  customMetrics: []

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-query-api
          topologyKey: kubernetes.io/hostname

queryApi:
  port: 8080

# Variáveis de ambiente injetadas via ConfigMap (não-sensíveis).
# DB endpoints (tsdb, pg, clickhouse, redis) vêm do Secret "dodo-db-credentials"
# do cluster via valueFrom.secretKeyRef no deployment.yaml.
env:
  DODO_QUERY_READ_TIMEOUT: 30s
  DODO_QUERY_WRITE_TIMEOUT: 30s
  DODO_QUERY_SHUTDOWN_TIMEOUT: 30s
  DODO_QUERY_GRAPHQL_MAX_DEPTH: "10"
  DODO_QUERY_GRAPHQL_MAX_COMPLEXITY: "1000"
  DODO_QUERY_GRAPHQL_PLAYGROUND_ENABLED: "false"
  DODO_QUERY_WS_MAX_CONNECTIONS: "10000"
  DODO_QUERY_WS_PING_INTERVAL: 30s
  DODO_QUERY_WS_PONG_TIMEOUT: 10s
  DODO_QUERY_TIMESCALEDB_MAX_OPEN_CONNS: "25"
  DODO_QUERY_TIMESCALEDB_MAX_IDLE_CONNS: "10"
  DODO_QUERY_TIMESCALEDB_CONN_MAX_LIFETIME: 5m
  DODO_QUERY_CLICKHOUSE_MAX_OPEN_CONNS: "10"
  DODO_QUERY_CLICKHOUSE_MAX_IDLE_CONNS: "5"
  DODO_QUERY_POSTGRESQL_MAX_OPEN_CONNS: "25"
  DODO_QUERY_POSTGRESQL_MAX_IDLE_CONNS: "10"
  DODO_QUERY_POSTGRESQL_CONN_MAX_LIFETIME: 5m
  DODO_QUERY_REDIS_DB: "0"
  DODO_QUERY_REDIS_POOL_SIZE: "20"
  DODO_QUERY_REDIS_MIN_IDLE_CONNS: "5"
  # DODO_QUERY_JWT_PUBLIC_KEY_PATH: /etc/aegis-query-api/certs/jwt-public.pem  # usar apenas com RS256 (secrets.jwtPubkey preenchido)
  # DODO_QUERY_JWT_SECRET é injetado via secrets.appCredentials para HS256 (padrão Supabase)
  DODO_QUERY_JWT_ISSUER: dodo_portal
  DODO_QUERY_JWT_AUDIENCE: dodo_query_api
  DODO_QUERY_RATELIMIT_ENABLED: "true"
  DODO_QUERY_RATELIMIT_REQUESTS_PER_SECOND: "100"
  DODO_QUERY_RATELIMIT_BURST_SIZE: "200"
  DODO_QUERY_CACHE_DEFAULT_TTL: 30s
  DODO_QUERY_CACHE_METRICS_TTL: 0s
  DODO_QUERY_CACHE_TOPOLOGY_TTL: 30s
  DODO_QUERY_LOG_LEVEL: info
  DODO_QUERY_LOG_FORMAT: json
  DODO_QUERY_CORS_ORIGINS: "*"
  DODO_AI_CORE_URL: http://aegis-ai-core:8080
  PANDAPROXY_URL: ""

# Secrets externos referenciados por nome (não criados pelo chart).
#   appCredentials — Secret com env vars adicionais (vazio em staging atual).
#   jwtPubkey      — Secret contendo `jwt-public.pem` (volume-mounted como arquivo).
#                    Pipeline do repo dodo_query_api cria/atualiza com a chave pública JWT.
#   dbCredentials  — pattern legacy mantido para forward-compat.
secrets:
  appCredentials: ""
  jwtPubkey: ""
  dbCredentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 5432  # TimescaleDB
    - ports:
        - protocol: TCP
          port: 5433  # pgvector (CMDB)
    - ports:
        - protocol: TCP
          port: 9000  # ClickHouse
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 8080  # aegis-ai-core (in-cluster)
    - ports:
        - protocol: TCP
          port: 50051  # aegis-ingestor (gRPC self-monitoring)
    - ports:
        - protocol: TCP
          port: 9092  # Kafka (native_solution_consumer)
    - ports:
        - protocol: TCP
          port: 443  # GitHub API (token verification for GitHub integration)

tolerations: []
nodeSelector: {}
extraAnnotations: {}

aegis:
  agentID: "11111111-0000-4000-a000-000000000001"
  ingestorAddr: "aegis-ingestor.dodo.svc.cluster.local:50051"
  environment: "development"
