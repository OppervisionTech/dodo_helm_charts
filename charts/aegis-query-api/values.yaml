nameOverride: ""
fullnameOverride: ""
component: query-api
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-query-api
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  customMetrics: []

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-query-api
          topologyKey: kubernetes.io/hostname

queryApi:
  port: 8080
  timescaledbConnection: "host=aegis-timescaledb port=5432 dbname=aegisops"
  clickhouseConnection: "tcp://aegis-clickhouse:9000/aegisops"
  postgresqlConnection: "host=aegis-postgresql port=5432 dbname=aegisops"
  redisConnection: "aegis-redis:6379"
  corsAllowedOrigins: "*"
  graphqlSchemaPath: /etc/aegis-query-api/schema.graphql

secrets:
  dbCredentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 5432  # TimescaleDB + PostgreSQL
    - ports:
        - protocol: TCP
          port: 9000  # ClickHouse
    - ports:
        - protocol: TCP
          port: 6379  # Redis

tolerations: []
nodeSelector: {}
extraAnnotations: {}
