# =============================================================================
# aegis-query-api — Staging Environment Values
# =============================================================================
# Pré-requisitos no cluster antes do helm install:
#   1. Secret "dodo-db-credentials" no namespace alvo (DB host/port/password)
#   2. Secret "aegis-query-api-app-secrets" com a chave JWT do Supabase:
#
#      VERIFICAR no Supabase: Project Settings → API → JWT Settings
#
#      Se o projeto usa HS256 (padrão Supabase):
#        kubectl create secret generic aegis-query-api-app-secrets \
#          --from-literal=DODO_QUERY_JWT_SECRET=<supabase-jwt-secret> \
#          -n dodo
#        (Neste caso, manter secrets.jwtPubkey vazio abaixo)
#
#      Se o projeto usa RS256 (Supabase avançado):
#        kubectl create secret generic aegis-query-api-jwt \
#          --from-file=jwt-public.pem=<caminho-para-chave-publica-rs256.pem> \
#          -n dodo
#        (Neste caso, deixar secrets.appCredentials vazio e preencher secrets.jwtPubkey)
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_query_api
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 2

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  DODO_QUERY_CORS_ORIGINS: "https://dashboard.staging.oppervision.com.br,https://portal.staging.oppervision.com.br"
  DODO_QUERY_JWT_ISSUER: "https://vnkhsfwxqkyvjyncmvrt.supabase.co/auth/v1"
  DODO_QUERY_JWT_AUDIENCE: "authenticated"

ingress:
  enabled: true
  className: kong
  hostname: api.staging.oppervision.com.br
  tls:
    enabled: true
    secretName: api-staging-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"

secrets:
  # HS256 (padrão Supabase): referenciar o secret com DODO_QUERY_JWT_SECRET
  # e deixar jwtPubkey vazio.
  # RS256: deixar appCredentials vazio e preencher jwtPubkey com o secret PEM.
  appCredentials: "aegis-query-api-app-secrets"
  jwtPubkey: ""

aegis:
  agentID: "11111111-0000-4000-a000-000000000001"
  environment: "staging"
