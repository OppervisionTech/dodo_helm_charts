# =============================================================================
# aegis-query-api — Staging Environment Values
# =============================================================================
# Pré-requisitos no cluster antes do helm install:
#   1. Secret "dodo-db-credentials" no namespace alvo (DB host/port/password)
#   2. Secret "aegis-query-api-jwt" com a chave pública EC (ES256) do Supabase:
#
#      Supabase usa ES256 (ECDSA P-256). Obter a chave pública em:
#        Supabase → Project Settings → API → JWT Settings → JWKS endpoint:
#        https://vnkhsfwxqkyvjyncmvrt.supabase.co/auth/v1/.well-known/jwks.json
#
#      Converter JWK → PEM (Node.js):
#        node -e "
#          const { createPublicKey } = require('crypto');
#          const jwk = { /* cole o objeto da key aqui */ };
#          const key = createPublicKey({ key: jwk, format: 'jwk' });
#          process.stdout.write(key.export({ type: 'spki', format: 'pem' }));
#        " > jwt-public.pem
#
#      Criar o secret:
#        kubectl create secret generic aegis-query-api-jwt \
#          --from-file=jwt-public.pem=./jwt-public.pem \
#          -n dodo
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_query_api
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 2

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  DODO_QUERY_CORS_ORIGINS: "https://dashboard.staging.oppervision.com.br,https://portal.staging.oppervision.com.br"
  DODO_QUERY_JWT_ISSUER: "https://vnkhsfwxqkyvjyncmvrt.supabase.co/auth/v1"
  DODO_QUERY_JWT_AUDIENCE: "authenticated"
  DODO_QUERY_JWT_PUBLIC_KEY_PATH: /etc/aegis-query-api/certs/jwt-public.pem

ingress:
  enabled: true
  className: kong
  hostname: api.staging.oppervision.com.br
  tls:
    enabled: true
    secretName: api-staging-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"

secrets:
  # ES256 (ECDSA P-256 — algoritmo Supabase deste projeto):
  # chave pública em PEM no secret aegis-query-api-jwt (criado manualmente).
  appCredentials: ""
  jwtPubkey: "aegis-query-api-jwt"

aegis:
  agentID: "11111111-0000-4000-a000-000000000001"
  environment: "staging"
