# =============================================================================
# aegis-query-api — Staging Environment Values
# =============================================================================
# 2 réplicas, HPA moderado (2-5), CORS restrito aos domínios QA.
# image.repository e image.tag são sobrescritos pelo CI (reusable-helm-deploy)
# via --set image.repository=... --set image.tag=<sha>
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_query_api
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 2

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

secrets:
  dbCredentials: aegis-query-api-credentials

queryApi:
  corsAllowedOrigins: "https://dashboard.staging.aegisops.io,https://portal.staging.aegisops.io"
