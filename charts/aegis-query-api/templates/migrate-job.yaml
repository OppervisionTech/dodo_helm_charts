apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegis.fullname" . }}-migrate
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: migrate
          {{- include "aegis.image" . | nindent 10 }}
          args: ["--migrate"]
          env:
            {{- include "aegis.dbCredsEnv" (dict "components" (list "tsdb" "pg" "clickhouse" "redis" "kafka")) | nindent 12 }}
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BOOTSTRAP)"
            - name: DODO_QUERY_TIMESCALEDB_DSN
              value: "postgres://dodo:$(TSDB_PASSWORD)@$(TSDB_HOST):$(TSDB_PORT)/dodo_metrics?sslmode=disable"
            - name: DODO_QUERY_POSTGRESQL_DSN
              value: "postgres://dodo_app:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/dodo_cmdb?sslmode=disable"
            - name: DODO_QUERY_CLICKHOUSE_DSN
              value: "clickhouse://$(CLICKHOUSE_USERNAME):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_NATIVE_PORT)/$(CLICKHOUSE_DB)"
            - name: DODO_QUERY_REDIS_ADDRESS
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: DODO_QUERY_REDIS_PASSWORD
              value: "$(REDIS_PASSWORD)"
          envFrom:
            - configMapRef:
                name: {{ include "aegis.fullname" . }}
            {{- if .Values.secrets.appCredentials }}
            - secretRef:
                name: {{ .Values.secrets.appCredentials }}
            {{- end }}
            {{- if .Values.secrets.dbCredentials }}
            - secretRef:
                name: {{ .Values.secrets.dbCredentials }}
            {{- end }}
