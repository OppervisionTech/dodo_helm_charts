apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    {{- include "aegis.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        {{- include "aegis.prometheusAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aegis.podSecurityContext" . | nindent 6 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: query-api
          {{- include "aegis.image" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.queryApi.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- include "aegis.healthCheck" . | nindent 10 }}
          {{- include "aegis.resourceLimits" . | nindent 10 }}
          {{- include "aegis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "aegis.dbCredsEnv" (dict "components" (list "tsdb" "pg" "clickhouse" "redis" "kafka")) | nindent 12 }}
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BOOTSTRAP)"
            - name: DODO_QUERY_TIMESCALEDB_DSN
              value: "postgres://dodo:$(TSDB_PASSWORD)@$(TSDB_HOST):$(TSDB_PORT)/dodo_metrics?sslmode=disable"
            - name: DODO_QUERY_POSTGRESQL_DSN
              value: "postgres://dodo_app:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/dodo_cmdb?sslmode=disable"
            - name: DODO_QUERY_CLICKHOUSE_DSN
              value: "clickhouse://$(CLICKHOUSE_USERNAME):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_NATIVE_PORT)/$(CLICKHOUSE_DB)"
            - name: DODO_QUERY_REDIS_ADDRESS
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: DODO_QUERY_REDIS_PASSWORD
              value: "$(REDIS_PASSWORD)"
            {{- if .Values.aegis.agentID }}
            - name: AEGIS_AGENT_ID
              value: {{ .Values.aegis.agentID | quote }}
            - name: AEGIS_INGESTOR_ADDR
              value: {{ .Values.aegis.ingestorAddr | quote }}
            - name: AEGIS_ENVIRONMENT
              value: {{ .Values.aegis.environment | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "aegis.fullname" . }}
            {{- if .Values.secrets.appCredentials }}
            - secretRef:
                name: {{ .Values.secrets.appCredentials }}
            {{- end }}
            {{- if .Values.secrets.dbCredentials }}
            - secretRef:
                name: {{ .Values.secrets.dbCredentials }}
            {{- end }}
          volumeMounts:
            {{- if .Values.secrets.jwtPubkey }}
            - name: jwt-certs
              mountPath: /etc/aegis-query-api/certs
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.secrets.jwtPubkey }}
        - name: jwt-certs
          secret:
            secretName: {{ .Values.secrets.jwtPubkey }}
            defaultMode: 0444
        {{- end }}
        - name: tmp
          emptyDir: {}
