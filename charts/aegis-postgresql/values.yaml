nameOverride: ""
fullnameOverride: ""
component: postgresql
gitSha: ""

image:
  repository: pgvector/pgvector
  tag: "pg16"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

health:
  type: tcp
  liveness:
    port: postgresql
    initialDelay: 30
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    port: postgresql
    initialDelay: 10
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 70
  runAsGroup: 70
  fsGroup: 70

containerSecurityContext:
  readOnlyRootFilesystem: false

metrics:
  enabled: true
  port: 9187
  path: /metrics

service:
  port: 5432

persistence:
  enabled: true
  storageClass: ""
  size: 50Gi

pdb:
  enabled: true
  minAvailable: 1

postgresql:
  port: 5432
  database: aegisops
  config:
    sharedBuffers: 512MB
    workMem: 32MB
    effectiveCacheSize: 1536MB

initDb:
  enabled: true
  extensions:
    - pgvector
    - pg_trgm

secrets:
  credentials: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 5432
  egress: []

tolerations: []
nodeSelector: {}
extraAnnotations: {}
