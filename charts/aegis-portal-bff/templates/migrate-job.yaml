apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegis.fullname" . }}-migrate
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "aegis.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          {{- include "aegis.image" . | nindent 10 }}
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            {{- if .Values.secrets.appCredentials }}
            - secretRef:
                name: {{ .Values.secrets.appCredentials }}
            {{- end }}
