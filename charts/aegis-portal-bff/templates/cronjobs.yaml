{{- /*
Scheduled triggers for portal_bff's /api/cron/* endpoints (CronGuard:
Authorization: Bearer $CRON_SECRET). Before this nothing called them on a
schedule in-cluster — metering only ran when someone pressed the dev button.
concurrencyPolicy Forbid: a slow run must never overlap the next one.
*/ -}}
{{- if and .Values.cronJobs.enabled .Values.secrets.appCredentials }}
{{- range $job := .Values.cronJobs.jobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "aegis.fullname" $ }}-{{ $job.name }}
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
    aegisops.io/cron: {{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ $job.timeoutSeconds | default 900 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "aegis.name" $ }}-cron
            app.kubernetes.io/instance: {{ $.Release.Name }}
            aegisops.io/cron: {{ $job.name }}
        spec:
          restartPolicy: Never
          {{- include "aegis.podSecurityContext" $ | nindent 10 }}
          containers:
            - name: trigger
              image: {{ $.Values.cronJobs.image | quote }}
              {{- include "aegis.containerSecurityContext" $ | nindent 14 }}
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.secrets.appCredentials }}
                      key: CRON_SECRET
              command:
                - /bin/sh
                - -c
                - >-
                  curl --fail-with-body -sS -X POST
                  --max-time {{ $job.timeoutSeconds | default 900 }}
                  -H "Authorization: Bearer ${CRON_SECRET}"
                  http://{{ include "aegis.fullname" $ }}:{{ $.Values.service.port }}/api/cron/{{ $job.path }}
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
{{- end }}
{{- end }}
{{- end }}
