apiVersion: v2
name: aegis-kong
description: >
  DoDo AegisOps Kong — Routing e plugins de aplicação via Kong Ingress Controller.
  Define KongPlugin CRDs (rate-limit, JWT, CORS, security headers) e Ingress routes
  para ingestor (gRPC) e query-api (HTTP).
  PRÉ-REQUISITO: KIC e cert-manager provisionados pelo dodo_helm_charts_infra.
type: application
version: 0.2.0
appVersion: "3.6.0"
keywords:
  - kong
  - ingress
  - api-gateway
  - grpc
dependencies:
  - name: aegis-library
    version: "0.1.0"
    repository: "file://../_library"
maintainers:
  - name: Oppervision
    email: ops@oppervision.com.br
