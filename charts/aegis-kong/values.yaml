# =============================================================================
# aegis-kong — Kong Ingress Controller (KIC) Values
# =============================================================================
# Wraps o chart oficial kong/ingress (KIC v3).
# Rotas API definidas via Ingress + KongPlugin CRDs.
#
# PRÉ-REQUISITO: Instalar os CRDs do Kong antes do primeiro deploy:
#   helm repo add kong https://charts.konghq.com
#   helm repo update
#   # Os CRDs são instalados automaticamente pelo subchart (kic)
# =============================================================================

gitSha: ""

# ---------------------------------------------------------------------------
# KIC Subchart (alias: kic) — configura gateway + controller
# Ref: https://github.com/Kong/charts/tree/main/charts/ingress
# ---------------------------------------------------------------------------
kic:
  # Gateway (Kong proxy)
  gateway:
    enabled: true
    replicaCount: 2
    image:
      repository: kong
      tag: "3.6"
      pullPolicy: IfNotPresent

    env:
      database: "off"  # DB-less mode obrigatório com KIC

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Proxy service — exposto como LoadBalancer
    proxy:
      type: LoadBalancer
      http:
        enabled: true    # Necessário para ACME HTTP-01 challenge do cert-manager
        servicePort: 80
        containerPort: 8000
      tls:
        enabled: true
        servicePort: 443
        containerPort: 8443

    # Admin API — desabilitado por padrão, habilitado apenas em dev
    admin:
      enabled: false
      type: ClusterIP
      http:
        enabled: false
      tls:
        enabled: false

    # Status port para health checks internos
    status:
      enabled: true
      http:
        enabled: true
        containerPort: 8100

    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

  # Ingress Controller
  controller:
    enabled: true
    replicaCount: 1
    image:
      repository: kong/kubernetes-ingress-controller
      tag: "3.2"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    ingressClass: kong

    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534

    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

  # HPA para o gateway
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# KongPlugin resources (CRDs)
# ---------------------------------------------------------------------------
plugins:
  # Rate limiting global para ingestor
  rateLimitingIngestor:
    enabled: true
    minuteLimit: 1000
    secondLimit: 100
    policy: local  # local | redis (usar redis em prod para distribuído)

  # Rate limiting para enrollment (baixo — agents não enrollam com frequência)
  rateLimitingEnrollment:
    enabled: true
    minuteLimit: 10
    secondLimit: 2
    policy: local

  # Rate limiting para query-api
  rateLimitingApi:
    enabled: true
    minuteLimit: 500
    secondLimit: 50
    policy: local

  # Rate limiting para os webhooks inbound do dodo_alerts (Slack slash
  # commands + Teams messages). Slack retries a request up to 3x if it
  # doesn't get an ack fast enough — o limite aqui é folgado o bastante
  # pra absorver isso sem bloquear uso normal.
  rateLimitingAlerts:
    enabled: true
    minuteLimit: 120
    secondLimit: 10
    policy: local

  # JWT Authentication
  jwtAuth:
    enabled: true
    keyClaimName: iss
    maximumExpiration: 3600

  # CORS para query-api
  corsApi:
    enabled: true
    origins:
      - "*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    headers:
      - Authorization
      - Content-Type
      - X-Requested-With
      - X-Org-ID
    credentials: true
    maxAge: 3600

  # Security Headers para dashboard/portal
  securityHeaders:
    enabled: true

# ---------------------------------------------------------------------------
# KongConsumers — identidades reconhecidas pelo plugin jwt (config acima).
# O Secret de credencial NÃO é criado por este chart (sem segredo em texto
# plano aqui) — precisa existir previamente no mesmo namespace, no formato
# esperado pelo KIC (chave `kongCredType: jwt` + `key`/`algorithm`/
# `rsa_public_key`). Ver docs/deploy-guide.md.
# ---------------------------------------------------------------------------
consumers:
  # Consumer compartilhado por todos os aegis-agent — o dodo_ingestor assina
  # os JWTs emitidos no enrollment com `iss` = agents.jwtIssuer, e o plugin
  # jwt do Kong valida a assinatura contra a rsa_public_key desta credencial.
  # A identidade por-agent continua garantida pelo client cert mTLS; este JWT
  # só existe para satisfazer o plugin jwt anexado à rota do ingestor.
  agents:
    enabled: true
    username: aegis-agents
    jwtIssuer: aegis-agents
    jwtCredentialSecretName: aegis-agent-jwt-credential

# ---------------------------------------------------------------------------
# Ingress para rotas do tier de API (ingestor + query-api)
# Dashboard e portal têm seus próprios Ingress nos respectivos charts.
# ---------------------------------------------------------------------------
routes:
  # Rota gRPC para o ingestor
  ingestor:
    enabled: true
    hostname: ""  # definido por ambiente (ex: api.oppervision.com.br)
    # gRPC despacha pelo :path real do método (/<package>.<Service>/<Method>),
    # não por um prefixo /ingest arbitrário — precisa de um path por serviço
    # gRPC registrado no ingestor (ver internal/server/server.go).
    paths:
      - /dodo.proto.v1.IngestorService
      - /dodo.proto.v1.CommandService
    # aegis-ingestor-grpc, NOT aegis-ingestor: a gRPC-only Service so its
    # konghq.com/protocol=grpc annotation doesn't also land on the
    # enrollment port (see aegis-ingestor chart's service.yaml).
    service: aegis-ingestor-grpc
    port: 50051
    tls:
      enabled: true
      secretName: ""  # cert-manager provisiona automaticamente
    annotations:
      konghq.com/protocol: "grpcs"

  # Rota HTTP para a query-api
  queryApi:
    enabled: true
    hostname: ""  # definido por ambiente (ex: api.oppervision.com.br)
    path: /
    service: aegis-query-api
    port: 8080
    tls:
      enabled: true
      secretName: ""  # cert-manager provisiona automaticamente
    annotations:
      konghq.com/protocol: "https"

  # Rota HTTPS para auto-enrollment de certificados mTLS (sem mTLS, sem JWT)
  # Agents chamam este endpoint ANTES de ter certificados, então não pode exigir mTLS.
  enrollment:
    enabled: true
    hostname: ""  # definido por ambiente (ex: api.oppervision.com.br)
    # /v1/token/refresh reissues the short-lived agent JWT (see
    # consumers.agents) without touching the mTLS cert; same auth as
    # /v1/enroll (DODO_API_KEY bearer), so it belongs on this same
    # no-mTLS/no-jwt-plugin ingress.
    paths:
      - /v1/enroll
      - /v1/token/refresh
    service: aegis-ingestor
    port: 8082
    tls:
      enabled: true
      secretName: ""  # cert-manager provisiona automaticamente

  # Rota HTTPS para os webhooks inbound do dodo_alerts (Slack slash commands
  # + Teams Bot Framework messages). Sem JWT/CORS: Slack e Teams autenticam
  # com o próprio esquema deles (HMAC v0 / Bearer JWT do Bot Framework),
  # verificado dentro do handler — não pelo Kong. Só expõe os dois paths de
  # webhook, não o service inteiro (/metrics, /healthz seguem internos).
  alerts:
    enabled: true
    hostname: ""  # definido por ambiente (ex: alerts.oppervision.com.br)
    paths:
      - /webhooks/slack/commands
      - /webhooks/teams/messages
    service: aegis-alerts
    port: 8084
    tls:
      enabled: true
      secretName: ""  # cert-manager provisiona automaticamente
