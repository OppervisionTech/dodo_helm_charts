apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  kong.yaml: |
    _format_version: "3.0"
    services:
      - name: ingestor
        url: {{ .Values.kong.routes.ingestor.protocol }}://{{ .Values.kong.routes.ingestor.upstream }}
        routes:
          - name: ingestor-route
            paths:
              - {{ .Values.kong.routes.ingestor.path }}
            protocols:
              - https
      - name: query-api
        url: {{ .Values.kong.routes.queryApi.protocol }}://{{ .Values.kong.routes.queryApi.upstream }}
        routes:
          - name: query-api-route
            paths:
              - {{ .Values.kong.routes.queryApi.path }}
            protocols:
              - https
    {{- if .Values.kong.plugins.rateLimiting.enabled }}
    plugins:
      - name: rate-limiting
        config:
          minute: {{ .Values.kong.plugins.rateLimiting.minuteLimit }}
          second: {{ .Values.kong.plugins.rateLimiting.secondLimit }}
          policy: local
      {{- if .Values.kong.plugins.prometheus }}
      - name: prometheus
      {{- end }}
      {{- if .Values.kong.plugins.cors.enabled }}
      - name: cors
        config:
          origins:
            - {{ .Values.kong.plugins.cors.origins | quote }}
          methods:
            {{- range (splitList "," .Values.kong.plugins.cors.methods) }}
            - {{ . }}
            {{- end }}
      {{- end }}
    {{- end }}
