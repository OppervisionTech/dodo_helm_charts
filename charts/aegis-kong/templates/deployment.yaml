apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    {{- include "aegis.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        {{- include "aegis.prometheusAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- include "aegis.podSecurityContext" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kong
          {{- include "aegis.image" . | nindent 10 }}
          ports:
            - name: proxy
              containerPort: {{ .Values.kong.proxyPort }}
              protocol: TCP
            {{- if .Values.kong.admin.enabled }}
            - name: admin
              containerPort: {{ .Values.kong.adminPort }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.kong.metricsPort }}
              protocol: TCP
          {{- include "aegis.healthCheck" . | nindent 10 }}
          {{- include "aegis.resourceLimits" . | nindent 10 }}
          {{- include "aegis.containerSecurityContext" . | nindent 10 }}
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yaml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:{{ .Values.kong.proxyPort }} ssl"
            {{- if .Values.kong.admin.enabled }}
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:{{ .Values.kong.adminPort }} ssl"
            {{- else }}
            - name: KONG_ADMIN_LISTEN
              value: "off"
            {{- end }}
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_PLUGINS
              value: "bundled"
          volumeMounts:
            - name: config
              mountPath: /etc/kong
              readOnly: true
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/kong/tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: kong-prefix
              mountPath: /kong_prefix
      volumes:
        - name: config
          configMap:
            name: {{ include "aegis.fullname" . }}
        {{- if .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: kong-prefix
          emptyDir:
            sizeLimit: 256Mi
