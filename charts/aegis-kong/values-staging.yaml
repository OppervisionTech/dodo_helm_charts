# =============================================================================
# aegis-kong — Staging Environment Values
# =============================================================================
# 2 réplicas, HPA moderado (2-5), TLS via cert-manager (LE staging).
# Admin API desabilitada.
# =============================================================================

kic:
  gateway:
    replicaCount: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    proxy:
      type: LoadBalancer
    admin:
      enabled: false

  controller:
    replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

plugins:
  corsApi:
    origins:
      - "https://dashboard.staging.oppervision.com.br"
      - "https://portal.staging.oppervision.com.br"
  rateLimitingEnrollment:
    enabled: true
    minuteLimit: 10
    secondLimit: 2
    policy: local

routes:
  ingestor:
    # Dedicated hostname — NOT api.staging.oppervision.com.br. ALPN protocol
    # (h2 vs http/1.1) is negotiated during the TLS handshake, before Kong
    # can see the request path, so a hostname can only unambiguously serve
    # one of {https, grpcs}. Sharing api.staging with the https routes
    # (enrollment, query-api) caused non-deterministic ALPN negotiation —
    # confirmed live: concurrent connections to the same host/cert got h2 on
    # some and http/1.1 on others, and gRPC clients (tonic) hard-fail the
    # connection whenever they land on the latter.
    hostname: "grpc.staging.oppervision.com.br"
    tls:
      enabled: true
    # letsencrypt-staging issues certs untrusted by any real client (curl,
    # this agent's TLS stack, etc.) — confirmed live: it silently broke
    # both the grpc route and, separately, the enrollment route below the
    # same way, each time only noticed because a real client started
    # failing TLS verification. Real cert, negligible rate-limit risk
    # (well under 50/week per registered domain).
    clusterIssuer: "letsencrypt-production"
  queryApi:
    hostname: "api.staging.oppervision.com.br"
    tls:
      enabled: true
    clusterIssuer: "letsencrypt-production"
  enrollment:
    enabled: true
    hostname: "api.staging.oppervision.com.br"
    tls:
      enabled: true
    clusterIssuer: "letsencrypt-production"
  alerts:
    enabled: true
    hostname: "alerts.staging.oppervision.com.br"
    tls:
      enabled: true
    clusterIssuer: "letsencrypt-production"
