# =============================================================================
# aegis-kong — Staging Environment Values
# =============================================================================
# 2 réplicas, HPA moderado (2-5), TLS via cert-manager (LE staging).
# Admin API desabilitada.
# =============================================================================

kic:
  gateway:
    replicaCount: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    proxy:
      type: LoadBalancer
    admin:
      enabled: false

  controller:
    replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

plugins:
  corsApi:
    origins:
      - "https://dashboard.staging.oppervision.com.br"
      - "https://portal.staging.oppervision.com.br"

routes:
  ingestor:
    hostname: "api.staging.oppervision.com.br"
    tls:
      enabled: true
    clusterIssuer: "letsencrypt-staging"
  queryApi:
    hostname: "api.staging.oppervision.com.br"
    tls:
      enabled: true
    clusterIssuer: "letsencrypt-staging"
