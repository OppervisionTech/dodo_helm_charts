apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
data:
  config.yaml: |
    kafka_brokers: {{ .Values.ingestor.kafkaBrokers | quote }}
    redis_endpoint: {{ .Values.ingestor.redisEndpoint | quote }}
    rate_limit_rps: {{ .Values.ingestor.rateLimitRps }}
    batch_size: {{ .Values.ingestor.batchSize }}
    batch_timeout_ms: {{ .Values.ingestor.batchTimeoutMs }}
