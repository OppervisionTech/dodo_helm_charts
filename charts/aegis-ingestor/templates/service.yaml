apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: {{ .Values.service.protocol }}
      name: grpc
    {{- if .Values.enrollment.enabled }}
    - port: {{ .Values.enrollment.port }}
      targetPort: enrollment
      protocol: TCP
      name: enrollment
    {{- end }}
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}
