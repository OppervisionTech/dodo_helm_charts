apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    {{- include "aegis.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        {{- include "aegis.prometheusAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aegis.podSecurityContext" . | nindent 6 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingestor
          {{- include "aegis.image" . | nindent 10 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.health.liveness.port }}
              protocol: TCP
            {{- if .Values.enrollment.enabled }}
            - name: enrollment
              containerPort: {{ .Values.enrollment.port }}
              protocol: TCP
            {{- end }}
          {{- include "aegis.healthCheck" . | nindent 10 }}
          {{- include "aegis.resourceLimits" . | nindent 10 }}
          {{- include "aegis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "aegis.dbCredsEnv" (dict "components" (list "redis" "pg" "kafka")) | nindent 12 }}
            - name: INGESTOR_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: INGESTOR_POSTGRES_DSN
              value: "postgres://dodo_app:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/dodo_cmdb?sslmode=disable"
            - name: INGESTOR_KAFKA_BROKERS
              value: "$(KAFKA_BOOTSTRAP)"
            {{- if .Values.aegis.agentID }}
            - name: AEGIS_AGENT_ID
              value: {{ .Values.aegis.agentID | quote }}
            - name: AEGIS_INGESTOR_ADDR
              value: {{ .Values.aegis.ingestorAddr | quote }}
            - name: AEGIS_ENVIRONMENT
              value: {{ .Values.aegis.environment | quote }}
            {{- end }}
            {{- if .Values.enrollment.enabled }}
            - name: INGESTOR_ENROLLMENT_PORT
              value: {{ .Values.enrollment.port | quote }}
            - name: INGESTOR_PORTAL_VERIFY_URL
              value: {{ .Values.enrollment.portalVerifyURL | quote }}
            - name: AEGIS_CA_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enrollment.caSecretName }}
                  key: ca.crt
            - name: AEGIS_CA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enrollment.caSecretName }}
                  key: ca.key
            {{- if .Values.enrollment.jwtSecretName }}
            - name: AEGIS_AGENT_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enrollment.jwtSecretName }}
                  key: jwt-private.pem
            {{- end }}
            {{- end }}
            # Per-org plan limits (entitlements from portal-bff): suspended
            # orgs, per-org ingest rate, Free daily log cap, host cap,
            # retention headers. off -> shadow (one cycle) -> enforce.
            - name: INGESTOR_LIMITS_MODE
              {{- if .Values.retentionPolicy.enabled }}
              # From the environment policy (Terraform ConfigMap).
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.retentionPolicy.configMap }}
                  key: INGESTOR_LIMITS_MODE
                  optional: true
              {{- else }}
              value: {{ .Values.planLimits.mode | quote }}
              {{- end }}
            - name: INGESTOR_PORTAL_INTERNAL_URL
              value: {{ .Values.planLimits.portalInternalURL | quote }}
            - name: INGESTOR_ORG_RATELIMIT_TOKENS_PER_SEC
              value: {{ .Values.planLimits.orgTokensPerSec | quote }}
            - name: INGESTOR_ORG_RATELIMIT_BURST
              value: {{ .Values.planLimits.orgBurst | quote }}
            {{- if .Values.planLimits.serviceKeySecretName }}
            - name: PORTAL_INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.planLimits.serviceKeySecretName }}
                  key: PORTAL_INTERNAL_SERVICE_KEY
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/aegis-ingestor
              readOnly: true
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/aegis-ingestor/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aegis.fullname" . }}
        {{- if .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
