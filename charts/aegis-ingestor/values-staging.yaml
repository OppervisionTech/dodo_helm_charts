# =============================================================================
# aegis-ingestor — Staging Environment Values
# =============================================================================
# 2 réplicas, HPA moderado (2-5), recursos intermediários.
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_ingestor
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: 75m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 256Mi

pdb:
  enabled: false  # minAvailable: 1 blocks rolling deploys with a single replica

ingestor:
  rateLimitRps: 5000
  batchSize: 100
  batchTimeoutMs: 50

enrollment:
  enabled: true
  caSecretName: "aegis-ca-secret"
  portalVerifyURL: "http://aegis-portal.dodo.svc.cluster.local:3000/api/api-keys/verify"

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 50051
    - ports:
        - protocol: TCP
          port: 8082  # enrollment
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 5433  # PostgreSQL
    - ports:
        - protocol: TCP
          # See values.yaml — NetworkPolicy egress matches the real
          # destination port (pod's containerPort, 3001), not the
          # Service port (3000) used in portalVerifyURL above.
          port: 3001  # dodo_portal container port (Service is 3000 -> targetPort 3001)

aegis:
  agentID: ""  # registrar no portal para habilitar self-monitoring
  environment: "staging"
