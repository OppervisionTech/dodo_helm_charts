nameOverride: ""
fullnameOverride: ""
component: ingestor
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-ingestor
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

health:
  type: grpc
  liveness:
    port: 50051
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    port: 50051
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 50051
  protocol: TCP

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics: []

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-ingestor
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aegis-ingestor

# Ingestor-specific configuration
ingestor:
  kafkaBrokers: "aegis-kafka:9092"
  redisEndpoint: "aegis-redis:6379"
  rateLimitRps: 10000
  batchSize: 100
  batchTimeoutMs: 50

tls:
  secretName: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 50051
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 5433  # PostgreSQL

tolerations: []
nodeSelector: {}
extraAnnotations: {}

aegis:
  agentID: "11111111-0000-4000-a000-000000000002"
  ingestorAddr: "aegis-ingestor.dodo.svc.cluster.local:50051"
  environment: "development"
