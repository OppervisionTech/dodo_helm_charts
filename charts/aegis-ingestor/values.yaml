nameOverride: ""
fullnameOverride: ""
component: ingestor
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-ingestor
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

health:
  type: http
  liveness:
    path: /healthz
    port: 8080
    initialDelay: 10
    period: 20
    timeout: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    port: 8080
    initialDelay: 5
    period: 10
    timeout: 3
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 50051
  protocol: TCP

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics: []

pdb:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-ingestor
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aegis-ingestor

# Ingestor-specific configuration
ingestor:
  kafkaBrokers: "aegis-kafka:9092"
  redisEndpoint: "aegis-redis:6379"
  rateLimitRps: 10000
  batchSize: 100
  batchTimeoutMs: 50

tls:
  secretName: ""

# Certificate auto-enrollment endpoint (POST /v1/enroll).
# Requires aegis-ca-secret to be created in the same namespace before deploy.
# See: docs/ops/create-ca-secret.md
enrollment:
  enabled: true
  port: 8082
  # Name of the K8s Secret holding ca.crt and ca.key (EC P-256).
  caSecretName: "aegis-ca-secret"
  # Portal API endpoint for API key verification. Set per environment.
  portalVerifyURL: ""
  # Name of the K8s Secret holding jwt-private.pem (RSA) — signs the
  # short-lived JWT agents present to Kong's jwt plugin on the ingestor
  # route. The matching public key must be registered as a Kong jwt
  # credential (see aegis-kong chart, consumers.agents). Empty disables JWT
  # issuance — enrollment still succeeds, but agents can't call jwt-guarded
  # routes until this is set.
  jwtSecretName: "aegis-agent-jwt"

# Per-org plan limits (see dodo_ingestor internal/entitlements). Needs the
# portal-bff internal URL and the shared PORTAL_INTERNAL_SERVICE_KEY.
planLimits:
  mode: "off"
  portalInternalURL: "http://aegis-portal-bff:8081"
  serviceKeySecretName: ""
  # Ingest rate for a 1.0x plan (Pro); Free runs at 0.25x.
  orgTokensPerSec: 20000
  orgBurst: 100000

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 50051
    - ports:
        - protocol: TCP
          port: 8082  # enrollment
    - ports:
        - protocol: TCP
          port: 8080  # healthz, exposto via Kong pro monitor externo de uptime
  egress:
    - ports:
        - protocol: TCP
          port: 9092  # Kafka
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 5433  # PostgreSQL
    - ports:
        - protocol: TCP
          # NetworkPolicy egress is enforced on the packet's real
          # destination port, i.e. the pod's containerPort (3001) —
          # AFTER kube-proxy DNATs the Service's port (3000) to it. Port
          # 3000 here silently dropped every request to aegis-portal:
          # the TCP connect() would hang until timeout, always, since
          # this rule never actually matched the real traffic.
          port: 3001  # dodo_portal container port (Service is 3000 -> targetPort 3001)
    - ports:
        - protocol: TCP
          port: 8081  # aegis-portal-bff (plan entitlements)

tolerations: []
nodeSelector: {}
extraAnnotations: {}

aegis:
  agentID: "11111111-0000-4000-a000-000000000002"
  ingestorAddr: "aegis-ingestor.dodo.svc.cluster.local:50051"
  environment: "development"

# Política de retenção do ambiente (ConfigMap criado pelo Terraform em
# dodo_infra/terraform). Desligado: o chart usa os próprios valores.
retentionPolicy:
  enabled: false
  configMap: dodo-retention-policy
