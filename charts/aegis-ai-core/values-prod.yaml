# =============================================================================
# aegis-ai-core — Production Environment Values
# =============================================================================
# 2 réplicas, GPU pronto (habilitar quando nós GPU disponíveis).
# Model cache 50Gi, todas as features habilitadas.
# =============================================================================

replicaCount: 2

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

gpu:
  enabled: false  # Habilitar quando nós GPU disponíveis no cluster

modelCache:
  size: 50Gi

aiCore:
  featureFlags:
    anomalyDetection: true
    ragEnabled: true
    classificationEnabled: true
    remediationEnabled: true
  models:
    anomalyThreshold: 0.95
    classificationMinConfidence: 0.8

# Merged into the chart's default env (values.yaml).
env:
  # AWS (FinOps/remediation into customer accounts): see aegis-query-api's
  # values-prod.yaml for the full setup; both services need the same.
  # Never probe the instance-metadata IP: on a non-AWS host (Hetzner, GCP)
  # it is another provider's metadata service, not AWS credentials.
  AWS_EC2_METADATA_DISABLED: "true"
  # The role customers' trust policies name (NEXT_PUBLIC_DODO_AWS_PRINCIPAL).
  DODO_AWS_PLATFORM_ROLE_ARN: ""  # arn:aws:iam::<ACCOUNT_ID>:role/dodo-platform
