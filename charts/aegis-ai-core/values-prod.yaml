# =============================================================================
# aegis-ai-core — Production Environment Values
# =============================================================================
# 2 réplicas, GPU pronto (habilitar quando nós GPU disponíveis).
# Model cache 50Gi, todas as features habilitadas.
# Pré-requisito: Secret "aegis-ai-core-app-secrets" com DODO_LLM_API_KEY,
# DODO_CLAUDE_API_KEY e DODO_EMBEDDING_API_KEY (OpenAI, embeddings do RAG).
# =============================================================================

replicaCount: 2

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

gpu:
  enabled: false  # Habilitar quando nós GPU disponíveis no cluster

modelCache:
  size: 50Gi

aiCore:
  featureFlags:
    anomalyDetection: true
    ragEnabled: true
    classificationEnabled: true
    remediationEnabled: true
  models:
    anomalyThreshold: 0.95
    classificationMinConfidence: 0.8

# Merged into the chart's default env (values.yaml).
env:
  # Copilot/Aegis coins: plan tiers and the pause at zero balance are
  # enforced (dev-env stays in shadow). Per-org overrides in Redis still win.
  DODO_AI_QUOTA_MODE: enforce
  # RAG falha alto sem DODO_EMBEDDING_API_KEY em vez de usar vetores falsos.
  DODO_EMBEDDING_STRICT_MODE: "true"

secrets:
  appCredentials: aegis-ai-core-app-secrets
