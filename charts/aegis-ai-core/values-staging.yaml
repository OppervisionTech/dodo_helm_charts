# =============================================================================
# aegis-ai-core — Staging Environment Values
# =============================================================================
# Pré-requisitos no cluster antes do helm install:
#   1. Secret "dodo-db-credentials" no namespace alvo (DB host/port/password)
#   2. Secret "aegis-ai-core-app-secrets" com DODO_LLM_API_KEY + DODO_CLAUDE_API_KEY
#      (Anthropic API key — criado pelo pipeline do repo dodo_ai_core)
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_ai_core
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

gpu:
  enabled: false

modelCache:
  size: 10Gi

env:
  DODO_ENVIRONMENT: staging

featureFlags:
  anomalyDetection: true
  ragEnabled: true
  classificationEnabled: true
  remediationEnabled: false

aiCore:
  port: 8000

service:
  port: 8000

# Staging: readyz exige models carregados (PVC vazio) — usar healthz
health:
  readiness:
    path: /healthz

secrets:
  appCredentials: aegis-ai-core-app-secrets
