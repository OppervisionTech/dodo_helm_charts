# =============================================================================
# aegis-ai-core — Staging Environment Values
# =============================================================================
# Pré-requisitos no cluster antes do helm install:
#   1. Secret "dodo-db-credentials" no namespace alvo (DB host/port/password)
#   2. Secret "aegis-ai-core-app-secrets" com DODO_LLM_API_KEY + DODO_CLAUDE_API_KEY
#      (Anthropic API key — criado pelo pipeline do repo dodo_ai_core)
# =============================================================================

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_ai_core
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

gpu:
  enabled: false

modelCache:
  size: 10Gi

env:
  DODO_ENVIRONMENT: staging
  DODO_LLM_PROVIDER: openrouter
  DODO_LLM_MODEL: nvidia/nemotron-3-super-120b-a12b:free
  # dodo_ai_core now default-denies openrouter/`:free` models for tool-calling
  # consumers (ChatOps) as a safety control — staging intentionally uses this
  # free model to avoid Anthropic costs, so opt it back in explicitly. The
  # client-side safety net (max_tokens-without-tool-call detection, real
  # outer timeout) still applies regardless of this allowlist.
  DODO_LLM_TOOLCALLING_ALLOWED_MODELS: "nvidia/nemotron-3-super-120b-a12b:free"

featureFlags:
  anomalyDetection: true
  ragEnabled: true
  classificationEnabled: true
  remediationEnabled: false

aiCore:
  port: 8000

service:
  port: 8000

# Staging: readyz exige models carregados (PVC vazio) — usar healthz
health:
  readiness:
    path: /healthz

secrets:
  appCredentials: aegis-ai-core-app-secrets

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 5433  # pgvector / TimescaleDB
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 443   # Anthropic API
