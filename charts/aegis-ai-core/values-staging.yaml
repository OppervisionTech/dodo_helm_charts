# =============================================================================
# aegis-ai-core — Staging Environment Values
# =============================================================================
# Pré-requisitos no cluster antes do helm install:
#   1. Secret "dodo-db-credentials" no namespace alvo (DB host/port/password)
#   2. Secret "aegis-ai-core-app-secrets" com DODO_LLM_API_KEY + DODO_CLAUDE_API_KEY
#      (Anthropic API key — criado pelo pipeline do repo dodo_ai_core)
# =============================================================================
# (verificação do pipeline cd-staging.yml — comentário de teste, sem efeito)

image:
  repository: registry.digitalocean.com/dodo-aegisops-staging/dodo_ai_core
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-dodo-aegisops-staging

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

gpu:
  enabled: false

modelCache:
  size: 10Gi

env:
  DODO_ENVIRONMENT: staging
  DODO_LLM_PROVIDER: openrouter
  # openai/gpt-4.1-mini, not the openrouter free tier: the free
  # nvidia/nemotron-3-super-120b-a12b:free model hit its 50 req/day quota
  # mid-demo-prep and had materially worse tool-call reliability (~0.7-0.95%
  # tool-call error rate on OpenRouter's own benchmarks vs GPT-4.1 Mini's
  # 0.00-0.26%) — see openrouter.ai/openai/gpt-4.1-mini for current pricing.
  DODO_LLM_MODEL: openai/gpt-4.1-mini
  # Real per-token price for the model above (in/out per 1K tokens) — keeps
  # Business Vision's self-reported "estimated LLM cost" honest. Without
  # this override it falls back to Settings' Anthropic-calibrated default
  # ($3/$15 per 1M), overstating real spend by ~7-9x for this model.
  DODO_LLM_COST_PER_1K_INPUT_TOKENS_USD: "0.0004"
  DODO_LLM_COST_PER_1K_OUTPUT_TOKENS_USD: "0.0016"
  # Sem isso, o IncidentMonitor cria incidentes com org_id='' — invisíveis
  # pra qualquer org real no dashboard, mesmo com o poller rodando normal.
  DODO_MONITOR_ORG_ID: "27577b3b-6aaa-48db-b3c9-cba7e8299bd5"  # CoffeeCorp (staging)

featureFlags:
  anomalyDetection: true
  ragEnabled: true
  classificationEnabled: true
  remediationEnabled: true

aiCore:
  port: 8000

metrics:
  port: 8000

service:
  port: 8000

# Staging: readyz exige models carregados (PVC vazio) — usar healthz
health:
  readiness:
    path: /healthz

secrets:
  appCredentials: aegis-ai-core-app-secrets

githubIntegration:
  tokenKeySecret: aegis-query-api-app-secrets

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 5432  # TimescaleDB
    - ports:
        - protocol: TCP
          port: 5433  # pgvector (CMDB)
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 443   # Anthropic API
    - ports:
        - protocol: TCP
          port: 8123  # ClickHouse HTTP (SLO SLI queries, cloud cost allocation)
    - ports:
        - protocol: TCP
          port: 3000  # aegis-portal (internal billing summary endpoint)
    - ports:
        - protocol: TCP
          port: 8081  # aegis-portal-bff (coin ledger: wallets, usage batches, rate card)
