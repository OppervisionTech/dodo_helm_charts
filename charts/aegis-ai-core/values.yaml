nameOverride: ""
fullnameOverride: ""
component: ai-core
gitSha: ""

image:
  repository: ghcr.io/oppervisiontech/aegis-ai-core
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

health:
  type: http
  liveness:
    path: /healthz
    port: http
    initialDelay: 30
    period: 30
    timeout: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    initialDelay: 10
    period: 15
    timeout: 5
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

containerSecurityContext:
  readOnlyRootFilesystem: true

metrics:
  enabled: true
  port: 9090
  path: /metrics

service:
  type: ClusterIP
  port: 8080

# GPU configuration
gpu:
  enabled: false
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi
      nvidia.com/gpu: 1
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# Init container for model download/validation
initContainer:
  enabled: false
  image:
    repository: ghcr.io/oppervisiontech/aegis-ai-core-init
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Model cache PVC
modelCache:
  enabled: true
  storageClass: ""
  size: 10Gi
  mountPath: /models

# AI Core configuration
aiCore:
  port: 8080
  pgvectorEndpoint: "aegis-postgresql:5432"
  clickhouseEndpoint: "aegis-clickhouse:9000"
  redisEndpoint: "aegis-redis:6379"
  featureFlags:
    anomalyDetection: true
    ragEnabled: true
    classificationEnabled: true
    remediationEnabled: false
  models:
    anomalyThreshold: 0.95
    classificationMinConfidence: 0.8

# Secret reference for LLM API keys
secrets:
  llmApiKeys: ""
  dbCredentials: ""
  certificates: ""

networkPolicy:
  enabled: true
  allowDNS: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 5432  # PostgreSQL/pgvector
    - ports:
        - protocol: TCP
          port: 9000  # ClickHouse native
    - ports:
        - protocol: TCP
          port: 8123  # ClickHouse HTTP
    - ports:
        - protocol: TCP
          port: 6379  # Redis
    - ports:
        - protocol: TCP
          port: 443   # LLM APIs (external)

tolerations: []
nodeSelector: {}
extraAnnotations: {}
