apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    {{- include "aegis.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy | default "Recreate" }}
  selector:
    matchLabels:
      {{- include "aegis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        {{- include "aegis.prometheusAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: {{ include "aegis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aegis.podSecurityContext" . | nindent 6 }}
      {{- if .Values.gpu.enabled }}
      nodeSelector:
        {{- toYaml .Values.gpu.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.gpu.tolerations | nindent 8 }}
      {{- else }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.initContainer.enabled }}
      initContainers:
        - name: model-init
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          resources:
            {{- toYaml .Values.initContainer.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
      {{- end }}
      containers:
        - name: ai-core
          {{- include "aegis.image" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.aiCore.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- include "aegis.healthCheck" . | nindent 10 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          {{- if .Values.gpu.enabled }}
          resources:
            requests:
              cpu: {{ .Values.gpu.resources.requests.cpu }}
              memory: {{ .Values.gpu.resources.requests.memory }}
            limits:
              cpu: {{ .Values.gpu.resources.limits.cpu }}
              memory: {{ .Values.gpu.resources.limits.memory }}
              nvidia.com/gpu: {{ .Values.gpu.resources.limits | dig "nvidia.com/gpu" 1 }}
          {{- else }}
          {{- include "aegis.resourceLimits" . | nindent 10 }}
          {{- end }}
          {{- include "aegis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "aegis.dbCredsEnv" (dict "components" (list "tsdb" "pg" "redis" "clickhouse")) | nindent 12 }}
            - name: DODO_DATABASE_URL
              value: "postgresql://dodo_app:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/dodo_ai_core"
            # Shared data stores read by ChatOps tools (get_active_incidents,
            # get_service_status, query_metrics, ...) — previously never wired
            # into this deployment, so these settings defaulted to empty and
            # every ChatOps data-store tool call failed with a connection error.
            - name: DODO_TIMESCALEDB_DSN
              value: "postgres://dodo:$(TSDB_PASSWORD)@$(TSDB_HOST):$(TSDB_PORT)/dodo_metrics?sslmode=disable"
            - name: DODO_POSTGRES_DSN
              value: "postgres://dodo_app:$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/dodo_cmdb?sslmode=disable"
            - name: DODO_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
            # Usage dimensions (kubernetesPodsCount, eventsCount from spans) for
            # cloud-cost proportional allocation — same store query_api already
            # reads for these exact dimensions in usageMetrics().
            - name: DODO_CLICKHOUSE_DSN
              value: "http://$(CLICKHOUSE_USERNAME):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_HTTP_PORT)/$(CLICKHOUSE_DB)"
            # dodo_portal's real Stripe-backed billing data — service-to-service,
            # authenticated by DODO_PORTAL_INTERNAL_SERVICE_KEY (from appCredentials),
            # not a user session.
            - name: DODO_PORTAL_INTERNAL_URL
              value: "http://aegis-portal:3000"
            {{- if .Values.githubIntegration.tokenKeySecret }}
            # Same AES-256-GCM key dodo_query_api uses to encrypt stored GitHub
            # PATs — referenced from its secret so ChatOps code-analysis tools
            # can decrypt and use the org's already-connected token, without a
            # second copy of the key living in a separate Secret object.
            - name: DODO_GITHUB_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubIntegration.tokenKeySecret }}
                  key: DODO_QUERY_GITHUB_TOKEN_KEY
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "aegis.fullname" . }}
            {{- if .Values.secrets.appCredentials }}
            - secretRef:
                name: {{ .Values.secrets.appCredentials }}
            {{- end }}
            {{- if .Values.secrets.llmApiKeys }}
            - secretRef:
                name: {{ .Values.secrets.llmApiKeys }}
            {{- end }}
            {{- if .Values.secrets.dbCredentials }}
            - secretRef:
                name: {{ .Values.secrets.dbCredentials }}
            {{- end }}
          volumeMounts:
            {{- if .Values.modelCache.enabled }}
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.modelCache.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "aegis.fullname" . }}-models
        {{- end }}
        - name: tmp
          emptyDir: {}
