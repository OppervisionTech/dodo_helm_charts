# =============================================================================
# aegis-timescaledb — Staging Environment Values
# =============================================================================
# Storage médio, configuração moderada de memória.
# =============================================================================

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

persistence:
  size: 50Gi

timescaledb:
  config:
    sharedBuffers: 512MB
    workMem: 32MB
    effectiveCacheSize: 1536MB
    maxBackgroundWorkers: 6
  # retentionDays removido (sem efeito) — ver values.yaml.
