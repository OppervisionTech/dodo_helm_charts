# =============================================================================
# aegis-timescaledb — Production Environment Values
# =============================================================================
# Storage 500Gi, configuração de memória para alta carga.
# Retenção de 90 dias para métricas.
# =============================================================================

resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 8Gi

persistence:
  size: 500Gi

timescaledb:
  config:
    sharedBuffers: 4GB
    workMem: 64MB
    effectiveCacheSize: 6GB
    maxBackgroundWorkers: 8
  # retentionDays removido (sem efeito) — ver values.yaml.
